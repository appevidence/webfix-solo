[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webfix-solo"
dynamic = ["version"]
description = "Minimalist single-user CLI utility for hash-chained, signed web-page captures (Repo C of the evidence-capture three-repo split)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "appevidence" }]
keywords = [
    "web-archiving",
    "forensics",
    "playwright",
    "ed25519",
    "rfc3161",
    "opentimestamps",
    "cli",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Security :: Cryptography",
]
# Runtime dependencies are intentionally minimal. The web layer of Repo A
# (FastAPI / Starlette / Uvicorn / Jinja2 / slowapi / OpenTelemetry / Alembic /
# eth-*) is NOT a dependency of Repo C — see docs/Current-State.md and the
# "Related projects" table in the upstream README.
dependencies = [
    "playwright>=1.46,<2.0",
    "cryptography>=44,<47",
    "PyNaCl>=1.5,<2.0",
    "rfc3161-client>=1.0.3,<2.0",
    "httpx>=0.27,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
# Opt-in extras for Repo C — see scope rationale in the upstream PR #65.
ots = ["opentimestamps-client>=0.7,<1.0"]
wayback = []  # uses httpx; flag-gated, no extra runtime deps required
eth = [
    # Ethereum anchoring is intentionally an opt-in extra. ~95% of solo users
    # have neither a key nor gas; do not pay the dependency cost by default.
    "web3>=6.20,<8.0",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
    "pre-commit>=3.7,<5.0",
    "mypy>=1.10,<2.0",
]

[project.urls]
Homepage = "https://github.com/appevidence/webfix-solo"
"Related projects" = "https://github.com/appevidence/evidence-capture-app#related-projects-sibling-repositories"
Issues = "https://github.com/appevidence/webfix-solo/issues"

[project.scripts]
webfix = "webfix.cli:main"

[tool.setuptools.dynamic]
version = { attr = "webfix.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["webfix*", "app*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PL", "RUF"]
ignore = [
    "PLR2004",  # magic numbers in tests are fine
    "S101",     # asserts in tests are fine
    "B008",     # Typer relies on calls in argument defaults (typer.Option/Argument)
    "PLR0913",  # CLI commands legitimately have many flags
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
